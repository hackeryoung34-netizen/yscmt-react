name: VPS-free portal frontend checks

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/_redirects"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portal-frontend.yml"
  push:
    branches: [migration/vps-free-supabase-portal]
    paths:
      - "src/**"
      - "public/_redirects"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portal-frontend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
